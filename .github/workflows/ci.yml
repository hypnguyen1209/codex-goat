name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: node ${{ matrix.node }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # 20 is the floor `engines` promises; 24 is what development happens on. Testing
        # only the floor let `node --test "<glob>"` ship — it needs 22+, so it passed
        # locally and failed in CI. Testing only the top would have hidden it the other way.
        node: [20, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run test:unit
      # Catches what unit tests cannot: skill frontmatter Codex would reject, a declared
      # stage with no skill, an unindexed role prompt, a hook pointing at an unshipped file.
      - run: npm run test:contract

  native:
    name: native runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy -p goat-runtime --all-targets -- -D warnings
      # Includes the fixture shared with the TypeScript compressor, so the two
      # implementations cannot drift apart.
      - run: cargo test -p goat-runtime

  cross:
    # The release builds goat-runtime for five targets. Without this, a target that
    # stopped compiling would only surface at tag time, with the npm publish already
    # done and the release half-finished. Build-only: running each target is the
    # release job's business, and most cannot execute on this host anyway.
    name: cross-compile ${{ matrix.target }}
    if: github.event_name == 'push'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: aarch64-unknown-linux-gnu, apt: gcc-aarch64-linux-gnu, linker: aarch64-linux-gnu-gcc }
          - { os: macos-14, target: x86_64-apple-darwin }
          - { os: macos-14, target: aarch64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: cross-${{ matrix.target }}
      - if: matrix.apt != ''
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.apt }}
      - env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.linker }}
        run: cargo build --release --locked --target ${{ matrix.target }} -p goat-runtime

  smoke:
    name: install smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: setup, doctor, and uninstall against a scratch project
        run: |
          set -euo pipefail
          GOAT="$PWD/dist/cli/goat.js"
          mkdir -p /tmp/scratch && cd /tmp/scratch
          git init -q && echo '{"name":"scratch"}' > package.json

          node "$GOAT" setup --scope project
          # doctor exits non-zero on a failed check; codex is absent here, so only
          # assert that the goat-owned parts installed.
          node "$GOAT" doctor || true
          test -f .agents/skills/plan/SKILL.md
          test -f .codex/hooks.json
          grep -q 'GOAT:AGENTS:START' AGENTS.md

          # A recorded artifact must exist: `goat status` opens it. This script used to
          # record a path it never wrote, which is exactly the defect the check now
          # catches — the smoke test was itself an example of the bug.
          mkdir -p .goat/plans && printf '# plan\n' > .goat/plans/p.md

          # The evidence gate has three holes worth guarding, all of them regressions we
          # actually shipped in v0.1.0. Each arm must FAIL the status gate.
          # $ultragoal, not $plan: a plan is proven by its artifact, so the command-proof
          # arms need a stage whose claim is about behaviour.
          node "$GOAT" state set --stage ultragoal --status complete
          if node "$GOAT" status; then
            echo "FAIL: a completion with no evidence passed the gate" >&2
            exit 1
          fi

          node "$GOAT" ledger evidence --stage ultragoal --exit 1 -- npm test
          if node "$GOAT" status; then
            echo "FAIL: a command that exited 1 was accepted as proof" >&2
            exit 1
          fi

          node "$GOAT" ledger evidence --stage ultragoal --exit 0 -- true
          if node "$GOAT" status; then
            echo "FAIL: a shell no-op was accepted as proof" >&2
            exit 1
          fi

          # Only a real command that actually exited 0 closes the gate.
          node "$GOAT" ledger evidence --stage ultragoal --exit 0 -- npm run lint
          node "$GOAT" status

          # A document stage is proven by its artifact being on disk, with no command.
          node "$GOAT" state set --stage plan --status complete --artifact .goat/plans/p.md
          node "$GOAT" status

          # A later `state set` must not erase the artifact an earlier call recorded.
          node "$GOAT" state set --stage plan --status complete
          node -e "
            const s = JSON.parse(require('node:fs').readFileSync('.goat/state/state.json', 'utf8'));
            if (s.stages.plan.artifact !== '.goat/plans/p.md') {
              console.error('FAIL: artifact was erased ->', s.stages.plan.artifact);
              process.exit(1);
            }
          "

          node "$GOAT" uninstall --scope project
          test ! -d .agents/skills/plan
          test -d .goat   # durable state must survive uninstall
